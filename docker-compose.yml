version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: jobintel }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    command: sh -c "(npx prisma migrate deploy || npx prisma db push) && npm run start"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/jobintel
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["3000:3000"]
  worker:
    build: ./worker
    command: python scheduler.py
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/jobintel
    depends_on: { postgres: { condition: service_healthy } }
volumes:
  pgdata:
