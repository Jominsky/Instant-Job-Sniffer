name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: jobintel, POSTGRES_PASSWORD: jobintel_test, POSTGRES_DB: jobintel_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobintel" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JOBINTEL_TEST_DSN: postgresql://jobintel:jobintel_test@localhost:5432/jobintel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r worker/requirements.txt
      - name: Worker tests (unit + Postgres integration)
        run: cd worker && python -m unittest discover -s tests -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npx prisma generate
      - name: Pure-logic tests
        run: node --import ./tests/register.mjs --test tests/*.test.ts
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://jobintel:jobintel_test@localhost:5432/jobintel_test
          NEXTAUTH_SECRET: ci-only-secret
          NEXTAUTH_URL: http://localhost:3000
