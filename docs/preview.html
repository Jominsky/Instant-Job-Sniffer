<script>
/* ---------- search parser: compiled from lib/searchQuery.ts, the same code the real app runs ---------- */
/* compiled from lib/searchQuery.ts (the same code the app uses) */
const TECH_VOCAB = ["Python", "Java", "C++", "C#", "C", "Rust", "Go", "Golang", "Kotlin", "Swift", "Scala", "TypeScript", "JavaScript", "React",
  "Node.js", "SQL", "PostgreSQL", "MySQL", "Redis", "Kafka", "Spark", "Hadoop", "AWS", "GCP", "Azure", "Kubernetes", "Docker", "Terraform", "Linux",
  "TCP/IP", "networking", "distributed systems", "multithreading", "low latency", "PyTorch", "TensorFlow", "CUDA", "OCaml", "Haskell", "KDB", "Pandas",
  "NumPy", "machine learning", "deep learning", "FPGA", "GraphQL", "gRPC"];

/** Turns a typed search like "quant internships chicago posted today" into structured filters + leftover free-text terms.
 *  Pure and dependency-free so it can be unit-tested. Anything it does not recognise stays a free-text term, so a query never
 *  silently loses words. Filters set explicitly in the filter bar always win over parsed ones (see lib/jobs.ts). */
                            
                  
            
                                                                      
                                                  
                                                    
                                                             
                                                                  
                                                                         
    
                                                                                          
                                                                                   
  

const SWE_FAMILY = ["SWE", "BACKEND", "FRONTEND", "FULL_STACK", "INFRASTRUCTURE", "DISTRIBUTED_SYSTEMS"];
const ROLE_PATTERNS                               = [   // most specific first; each match is consumed
  [/\bquant(?:itative)?\s+(?:developer|dev|engineer)s?\b/g, ["QUANT_DEVELOPER"], "Quant developer"],
  [/\bquant(?:itative)?\s+research(?:er)?s?\b/g, ["QUANT_RESEARCH"], "Quant research"],
  [/\bquant(?:itative)?\s+trad(?:ing|er)s?\b/g, ["QUANT_TRADING"], "Quant trading"],
  [/\bquant(?:itative)?\b/g, ["QUANT_DEVELOPER", "QUANT_RESEARCH", "QUANT_TRADING"], "Quant (all)"],
  [/\b(?:machine learning|ml|ai)\b/g, ["ML_AI"], "ML / AI"],
  [/\bdata\s+engineer(?:ing|s)?\b/g, ["DATA_ENGINEERING"], "Data engineering"],
  [/\b(?:dev\s?ops|sre)\b/g, ["DEVOPS_SRE"], "DevOps / SRE"],
  [/\bdistributed systems\b/g, ["DISTRIBUTED_SYSTEMS"], "Distributed systems"],
  [/\binfra(?:structure)?\b/g, ["INFRASTRUCTURE"], "Infrastructure"],
  [/\bback-?end\b/g, ["BACKEND"], "Backend"],
  [/\bfront-?end\b/g, ["FRONTEND"], "Frontend"],
  [/\bfull[- ]?stack\b/g, ["FULL_STACK"], "Full stack"],
  [/\bsecurity\b/g, ["SECURITY"], "Security"],
  [/\b(?:swe|software\s+(?:engineer(?:ing|s)?|developer|development))\b/g, SWE_FAMILY, "Software engineering"],
];
const LOCATIONS                     = [
  [/\b(?:nyc|new york(?: city)?)\b/g, "New York"], [/\b(?:sf|san francisco|bay area)\b/g, "San Francisco"],
  [/\bchicago\b/g, "Chicago"], [/\b(?:philly|philadelphia)\b/g, "Philadelphia"], [/\bboston\b/g, "Boston"],
  [/\bseattle\b/g, "Seattle"], [/\baustin\b/g, "Austin"], [/\blondon\b/g, "London"], [/\b(?:washington dc|dc)\b/g, "Washington"],
];
const STOP = new Set(["jobs", "job", "roles", "role", "positions", "position", "openings", "opening", "requiring", "require", "requires", "with", "in", "at",
  "for", "the", "a", "an", "and", "of", "from", "new", "posted", "discovered", "find", "show", "me", "that", "are", "is", "open", "hiring", "companies", "company", "any"]);

const WINDOWS                             = [
  [/\b(?:in the |within the )?last\s+(\d+)\s*(minutes?|mins?|hours?|hrs?|days?)\b/, -1, ""],   // computed below
  [/\blast\s+hour\b/, 60, "last hour"], [/\b(?:last\s+24\s*(?:hours|h)|past day)\b/, 1440, "last 24h"], [/\blast\s+week\b/, 10080, "last 7 days"],
  [/\bthis\s+week\b/, 10080, "last 7 days"], [/\bthis\s+month\b/, 43200, "last 30 days"], [/\btoday\b/, 1440, "last 24h"],
];


function parseSearch(input                           )               {
  const out               = { terms: [], filters: {}, wantsCompanies: false, explained: [] };
  if (!input?.trim()) return out;
  const quoted           = [];
  let s = " " + input.toLowerCase().replace(/"([^"]+)"/g, (_, p        ) => { quoted.push(p.trim()); return " "; }) + " ";
  const take = (re        , fn                               ) => { const m = s.match(re); if (m) { fn(m); s = s.replace(re, " "); return true; } return false; };

  // 1. time windows: "posted today" / "discovered this week" / bare "today"
  const kind = /\bposted\b/.test(s) ? "postedWithin" : "discoveredWithin";
  for (const [re, minutes, label] of WINDOWS) {
    if (take(re, (m) => {
      let mins = minutes, lab = label;
      if (minutes === -1) { const n = Number(m[1]); const u = m[2][0]; mins = u === "d" ? n * 1440 : u === "h" ? n * 60 : n; lab = `last ${n} ${m[2]}`; }
      out.filters[kind] = String(mins); out.explained.push(`${kind === "postedWithin" ? "Posted" : "Discovered"}: ${lab}`);
    })) break;
  }
  // 2. season / year ("spring" only with a year because "Spring" is also a Java framework)
  take(/\b(summer|fall|autumn|winter|spring)\s+(20[2-3]\d)\b/, (m) => { out.filters.season = cap(m[1] === "autumn" ? "fall" : m[1]); out.filters.year = m[2]; out.explained.push(`Season: ${out.filters.season} ${m[2]}`); });
  if (!out.filters.season) take(/\b(summer|fall|winter)\b/, (m) => { out.filters.season = cap(m[1]); out.explained.push(`Season: ${out.filters.season}`); });
  if (!out.filters.year) take(/\b(20[2-3]\d)\b/, (m) => { out.filters.year = m[1]; out.explained.push(`Year: ${m[1]}`); });
  // 3. experience level
  if (take(/\bnew[- ]?grads?\b/, () => { out.filters.exp = "NEW_GRAD"; out.explained.push("New grad"); })) { /* done */ }
  else if (take(/\bentry[- ]level\b/, () => { out.filters.exp = "ENTRY_LEVEL"; out.explained.push("Entry level"); })) { /* done */ }
  else take(/\b(?:internships?|interns?)\b/, () => { out.filters.exp = "INTERNSHIP"; out.explained.push("Internship"); });
  // 4. roles (accumulate)
  const roles           = [];
  for (const [re, cats, label] of ROLE_PATTERNS) take(re, () => { for (const c of cats) if (!roles.includes(c)) roles.push(c); out.explained.push(`Role: ${label}`); });
  if (roles.length) out.filters.role = roles.join(",");
  // 5. remote, locations
  take(/\bremote\b/, () => { out.filters.remote = "1"; out.explained.push("Remote"); });
  const locs           = [];
  for (const [re, name] of LOCATIONS) take(re, () => { if (!locs.includes(name)) locs.push(name); });
  if (locs.length) { out.filters.location = locs.join("|"); out.explained.push(`Location: ${locs.join(" or ")}`); }
  // 6. "companies ..." asks for a per-company summary
  out.wantsCompanies = /\bcompanies\b/.test(s);

  // 7. leftover tokens: known technologies become an ALL-of filter, stop words drop, the rest stay free text
  const techByLower = new Map(TECH_VOCAB.map((t) => [t.toLowerCase(), t]));
  const techs           = [];
  const terms           = [];
  for (const raw of s.split(/\s+/).filter(Boolean)) {
    const tok = raw.replace(/^[^\w+#.]+|[^\w+#]+$/g, "");   // keep C++, C#, node.js, .net inside the token
    if (!tok) continue;
    const tech = techByLower.get(tok);
    if (tech && !(tech === "Go" && raw !== tok) ) { if (!techs.includes(tech)) techs.push(tech); continue; }
    if (STOP.has(tok)) continue;
    terms.push(tok);
  }
  for (const q of quoted) if (q) terms.push(q);
  if (techs.length) { out.filters.techAll = techs.join(","); out.explained.push(`Mentions: ${techs.join(", ")}`); }
  out.terms = terms.slice(0, 8);
  return out;
}

function cap(w        ) { return w[0].toUpperCase() + w.slice(1); }

const ROLEMAP={SWE:["SWE"],BACKEND:["SWE"],FRONTEND:["SWE"],FULL_STACK:["SWE"],INFRASTRUCTURE:["SWE"],DISTRIBUTED_SYSTEMS:["SWE"],QUANT_DEVELOPER:["Quant Developer"],QUANT_RESEARCH:["Quant Research"],QUANT_TRADING:["Quant Trader"],ML_AI:["ML"],DATA_ENGINEERING:["Data"]};
const LVLMAP={INTERNSHIP:"Internship",NEW_GRAD:"New grad"};
function matchParsed(j,p){
  const f=p.filters, c=COMP[j.co];
  if(f.role&&!f.role.split(",").some(r=>(ROLEMAP[r]||[]).includes(j.role)))return false;
  if(f.exp&&LVLMAP[f.exp]!==j.lvl)return false;
  if(f.season&&!j.season.startsWith(f.season))return false;
  if(f.year&&!j.season.includes(f.year))return false;
  if(f.remote&&j.mode!=="Remote")return false;
  if(f.location&&!f.location.split("|").some(l=>j.loc.toLowerCase().includes(l.toLowerCase())))return false;
  if(f.postedWithin&&j.min>+f.postedWithin)return false;
  if(f.discoveredWithin&&j.min>+f.discoveredWithin)return false;
  if(f.techAll&&!f.techAll.split(",").every(t=>j.tech.some(x=>x.toLowerCase()===t.toLowerCase())))return false;
  return p.terms.every(t=>(j.title+" "+c.n+" "+j.loc+" "+j.tech.join(" ")).toLowerCase().includes(t.toLowerCase()));
}

function previewAlert(){const m=+$("#am").value;const l=$("#al").value;$("#amv").textContent=m;$("#apv").textContent="Would match "+visible().filter(j=>j.fit>=m&&(l==="Any"||j.lvl===l)).length+" of your current open jobs."}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-view],[data-open],[data-close],[data-tog],[data-save],[data-apply],[data-runsave],[data-delsave],[data-savesearch],#theme");if(!t)return;
  if(t.dataset.runsave!==undefined){state.q=state.saves[+t.dataset.runsave].q;render()}
  else if(t.dataset.delsave!==undefined){state.saves.splice(+t.dataset.delsave,1);render()}
  else if(t.dataset.savesearch!==undefined){state.saves.unshift({name:state.q.trim().slice(0,40),q:state.q.trim()});toast("Search saved.");render()}
  else if(t.dataset.view){state.view=t.dataset.view;state.sel=null;state.newIds.clear&&t.dataset.view==="fresh"&&state.newIds.clear();render()}
  else if(t.dataset.open){state.sel=+t.dataset.open;state.newIds.delete(state.sel);drawer()}
  else if("close" in t.dataset){state.sel=null;drawer()}
  else if(t.dataset.tog){const a=ALERTS.find(x=>x.id==t.dataset.tog);a.on=!a.on;render()}
  else if(t.dataset.save){const id=+t.dataset.save;if(!APPS[id]){state.saved.has(id)?state.saved.delete(id):state.saved.add(id);if(state.saved.has(id))toast("Saved. You'll be told if the employer changes the deadline or location.")}drawer()}
  else if(t.dataset.apply){const id=+t.dataset.apply;if(!APPS[id]){APPS[id]={st:"Applied",ref:"",next:""};toast("Marked as applied. Finish the application on the employer's site.")}else toast("In the real app this opens the employer's careers page.");drawer()}
  else if(t.id==="theme"){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;r.dataset.theme=dark?"light":"dark"}
});
document.addEventListener("input",e=>{

document.addEventListener("change",e=>{

  else if(t.dataset.move){APPS[t.dataset.move].st=t.value;toast("Moved to "+t.value);render()}
});
document.addEventListener("submit",e=>{
  if(e.target.id!=="newAlert")return;e.preventDefault();
  const ch=[...e.target.querySelectorAll('input[type=checkbox]:checked')].map(x=>x.value);
  if(!ch.length){toast("Pick at least one channel.");return}
  ALERTS.unshift({id:Date.now(),name:$("#an").value||"Untitled alert",on:true,min:+$("#am").value,lvl:$("#al").value,chan:ch,freq:$("#af").value,sent:0});toast("Alert created.");render();
});
$("#sim").addEventListener("click",()=>{
  const id=100+JOBS.length, fit=90+Math.floor(Math.random()*8);
  const nj=J(id,"northwind","Quantitative Developer Intern, Execution","Chicago, IL","Internship","Quant Developer",0,fit,"Summer 2027","Onsite",["C++","Python","Linux"],["Role matches your target: Quant Developer","Skills overlap: C++, Python, Linux","Location Chicago is on your list","Posted just now"],[],"Nov 21","$11,500 / month",[]);
  JOBS.unshift(nj);state.newIds.add(id);render();
  const hit=ALERTS.filter(a=>a.on&&fit>=a.min);
  toast(hit.length?`Alert sent via ${[...new Set(hit.flatMap(a=>a.chan))].join(", ")}: ${COMP.northwind.n} just opened a ${fit}-fit role.`:"New role found; no alert matched.");
});
render();
</script>
</body></html>
